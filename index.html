<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masjid HEW</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="mosque.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="prayer-container">
        <div class="islamic-border"></div>
        
        <div class="header">
            <h1 class="mosque-name"><i class="fas fa-mosque"></i>&nbsp&nbspMASJID HERBA EMAS WAHIDATAMA</h1>
            <div class="date-section" id="current-date">Day, DD/MM/YYYY</div>
        </div>
        
        <div class="clock-section">
            <div class="clock" id="digital-clock">--:--:--</div>
        </div>
        
        <div class="prayer-schedule">
            <div class="schedule-title">Jadwal Sholat Hari Ini</div>
            <div class="prayer-times">
                <div class="prayer-item">
                    <div class="prayer-name">Subuh</div>
                    <div class="prayer-time" id="subuh">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">Dzuhur</div>
                    <div class="prayer-time" id="dzuhur">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">Ashar</div>
                    <div class="prayer-time" id="ashar">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">Maghrib</div>
                    <div class="prayer-time" id="maghrib">--:--</div>
                </div>
                <div class="prayer-item">
                    <div class="prayer-name">Isya</div>
                    <div class="prayer-time" id="isya">--:--</div>
                </div>
            </div>
        </div>
        
        <!-- Decorative elements -->
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 100'%3E%3Cpath fill='%23d4af37' d='M25,10 L35,30 L25,25 L15,30 Z M20,30 L25,90 L30,30 Z'/%3E%3Cellipse cx='25' cy='10' rx='10' ry='5' fill='%23d4af37'/%3E%3Cellipse cx='25' cy='92' rx='8' ry='4' fill='%23d4af37'/%3E%3C/svg%3E" class="lantern lantern-1">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 100'%3E%3Cpath fill='%23d4af37' d='M25,10 L35,30 L25,25 L15,30 Z M20,30 L25,90 L30,30 Z'/%3E%3Cellipse cx='25' cy='10' rx='10' ry='5' fill='%23d4af37'/%3E%3Cellipse cx='25' cy='92' rx='8' ry='4' fill='%23d4af37'/%3E%3C/svg%3E" class="lantern lantern-2">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 100'%3E%3Cpath fill='%23d4af37' d='M25,10 L35,30 L25,25 L15,30 Z M20,30 L25,90 L30,30 Z'/%3E%3Cellipse cx='25' cy='10' rx='10' ry='5' fill='%23d4af37'/%3E%3Cellipse cx='25' cy='92' rx='8' ry='4' fill='%23d4af37'/%3E%3C/svg%3E" class="lantern lantern-3">
        
        <div class="mosque-silhouette"></div>
        
        <i class="fas fa-star decorative-star" style="top: 15%; left: 10%; font-size: 1.5vw;"></i>
        <i class="fas fa-star decorative-star" style="top: 20%; right: 20%; font-size: 1vw; animation-delay: 0.5s;"></i>
        <i class="fas fa-star decorative-star" style="top: 10%; right: 30%; font-size: 1.2vw; animation-delay: 1s;"></i>
        <i class="fas fa-star decorative-star" style="top: 30%; left: 25%; font-size: 0.8vw; animation-delay: 1.5s;"></i>
        <i class="fas fa-star decorative-star" style="top: 25%; right: 15%; font-size: 1.3vw; animation-delay: 2s;"></i>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
